name: Assemble C16 original PNG (one-time)
on:
  push:
    branches:
      - art/ending-originals-c01-c16-20261122
    paths:
      - '.github/workflows/ruosuen-assemble-c16-20261122.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'Makeinu1/DaD_Ruosuen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify original six PNGs, commit C16, purge transfer chunks
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 dm/episode-01/ending/v8/keyframe-test/results/C01-C16-2026-11-22/transfer-staging/assemble_c16.py
