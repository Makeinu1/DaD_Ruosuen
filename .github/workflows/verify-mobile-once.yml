name: Test mobile and desktop player portal (one-off)
on:
  push:
    branches: [ruosuen-responsive-art-20261117]
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - name: Serve the exact Pages candidate
        run: |
          python3 -m http.server 8819 --bind 127.0.0.1 > /tmp/ruosuen-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8819/ >/dev/null && break; sleep 1; done
      - name: Existing navigation and history regression (Chromium)
        run: RUOSUEN_FONT_FALLBACK=1 node tests/navigation.browser.cjs
      - name: Focused mobile typography, responsive images and nav (Chromium and WebKit)
        if: always()
        run: node tests/mobile-polish.browser.cjs
