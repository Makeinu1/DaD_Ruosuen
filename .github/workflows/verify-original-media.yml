name: Verify original PNG records

on:
  pull_request:
    paths:
      - 'dm/episode-01/ending/v8/keyframe-test/results/**'
      - 'world/npcs/art/avatar-fronts/**'
      - 'tools/vector-avator/approved-fronts.json'
      - 'tools/github-original-transfer/connector_packet.py'
      - 'tools/github-original-transfer/audit_repository_media.py'
      - 'tools/github-original-transfer/verify_originals_manifest.py'
      - '.github/workflows/verify-original-media.yml'
  push:
    branches: [main]
    paths:
      - 'dm/episode-01/ending/v8/keyframe-test/results/**'
      - 'world/npcs/art/avatar-fronts/**'
      - 'tools/vector-avator/approved-fronts.json'
      - 'tools/github-original-transfer/connector_packet.py'
      - 'tools/github-original-transfer/audit_repository_media.py'
      - 'tools/github-original-transfer/verify_originals_manifest.py'
      - '.github/workflows/verify-original-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute SHA-256 from checkout and compare Git blob SHA-1
        shell: bash
        run: |
          python3 tools/github-original-transfer/audit_repository_media.py \
            --repo-root . \
            --manifest dm/episode-01/ending/v8/keyframe-test/results/C11-C19-2026-11-21/manifest.json \
            --output original-media-audit.json
      - name: Verify 2026-11-22 user-uploaded six original PNGs against SHA-256 manifest
        shell: bash
        run: |
          python3 tools/github-original-transfer/verify_originals_manifest.py \
            --repo-root . \
            --manifest dm/episode-01/ending/v8/keyframe-test/results/C01-C16-2026-11-22/manifest.json \
            --output new-original-media-audit.json
      - name: Independently verify author-approved avatar PNGs
        if: ${{ hashFiles('tools/vector-avator/approved-fronts.json') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          manifest = json.loads(pathlib.Path('tools/vector-avator/approved-fronts.json').read_text())
          entries = manifest['assets']
          assert {a['path'] for a in entries} == {'bell-front.png', 'tucker-front.png'} and len(entries) == 2
          for a in entries:
              path = pathlib.Path('world/npcs/art/avatar-fronts') / a['path']
              raw = path.read_bytes()
              assert raw.startswith(b'\x89PNG\r\n\x1a\n'), str(path)
              assert len(raw) == a['bytes'], str(path)
              assert hashlib.sha256(raw).hexdigest() == a['sha256'], str(path)
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest() == a['git_blob_sha1'], str(path)
              assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == a['git_blob_sha1'], str(path)
              print(f"PASS {path} {len(raw)} bytes SHA-256={a['sha256']}")
          PY
      - name: Preserve verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-media-audit
          path: |
            original-media-audit.json
            new-original-media-audit.json
          if-no-files-found: warn